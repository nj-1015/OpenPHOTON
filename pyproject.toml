[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "openphoton"
version = "0.1.0"
description = "PHOTON hierarchical-KV architecture, converted from a pretrained Qwen3-0.6B by staged distillation."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Jun" }]
dependencies = [
    "torch>=2.10",
    "transformers>=5.3",
    "numpy",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools]
packages = [
    "photon",
    "inference",
    "configs",
    "harness",
    "checkpoint",
    "data",
    "train",
    "openphoton",
]
